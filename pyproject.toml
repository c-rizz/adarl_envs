[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adarl_envs"
version = "0.0.1"
authors = [
  { name="Carlo Rizzardo", email="cr.git.mail@gmail.com" },
]
description = "Jumping Leg"
readme = "README.md"
requires-python = ">=3.8.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: slow to run (builds a simulator and/or runs many steps)",
    "mujoco: exercises the MuJoCo (CPU) backend",
    "mjx: exercises the MJX (JAX/WARP, GPU) backend",
    "gpu: needs a CUDA/JAX GPU device",
]
